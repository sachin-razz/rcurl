[package]
name = "rcurl"
version = "0.1.0"
edition = "2021"
authors = ["Sachin Rajpurohit"]
description = "A high-performance 16-thread Tokio streaming CLI HTTP downloader and Hugging Face model suite fetcher with zero memory leaks"
readme = "README.md"
license = "MIT"
keywords = ["cli", "curl", "tokio", "streaming", "huggingface"]
categories = ["command-line-utilities", "asynchronous"]

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = { version = "0.17", features = ["tokio"] }
colored = "3.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
