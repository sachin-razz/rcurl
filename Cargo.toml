[package]
name = "rcurl"
version = "0.2.0"
edition = "2021"
authors = ["Sachin Rajpurohit"]
description = "Ultra-fast 16-Thread Tokio Parallel Streaming CLI HTTP Client with Bandwidth Throttling, Hash Verification, Proxies, and HTTP/2"
readme = "README.md"
license = "MIT"
keywords = ["cli", "curl", "tokio", "streaming", "http2"]
categories = ["command-line-utilities", "asynchronous"]

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "socks", "http2"] }
futures-util = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = { version = "0.17", features = ["tokio"] }
colored = "3.0"
anyhow = "1.0"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
dirs = "6.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
