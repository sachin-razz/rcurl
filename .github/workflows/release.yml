name: Release Pre-Compiled Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_name: rcurl-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: rcurl-macos-arm64.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: rcurl-linux-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_name: rcurl-windows-x86_64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package macOS / Linux Release
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rcurl dist/
          cp -r completions dist/
          cp README.md dist/
          tar -czvf ${{ matrix.archive_name }} -C dist .

      - name: Package Windows Release
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\rcurl.exe dist\
          copy README.md dist\
          tar -a -c -f ${{ matrix.archive_name }} -C dist *

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
